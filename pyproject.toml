[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convention-guardian"
version = "0.1.0"
description = "Full-project convention & structure audit with zero-logic-change pure-style fixes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MohammadHossein" }]
keywords = ["conventions", "style", "audit", "refactoring", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]
libcst = [
    "libcst>=1.4",
]
adapters = [
    "tree-sitter>=0.24",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
]

[project.scripts]
conventionguardian = "conventionguardian.cli:app_main"
cg = "conventionguardian.cli:app_main"

[tool.setuptools.packages.find]
include = ["conventionguardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
